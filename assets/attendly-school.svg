<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
    <stop stop-color="#EEF5FF"/>
    <stop offset="1" stop-color="#F8FAFC"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".10"/>
  </filter>
</defs>

<rect width="900" height="280" rx="28" fill="url(#sky)"/>
<circle cx="790" cy="58" r="27" fill="#F6C85F" opacity=".9">
  <animate attributeName="cy" values="58;53;58" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- school -->
<g filter="url(#shadow)">
  <path d="M92 142L250 65L408 142V235H92V142Z" fill="#FFFFFF"/>
  <path d="M72 143L250 52L428 143" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="145" width="46" height="90" rx="4" fill="#DBEAFE"/>
  <rect x="194" y="145" width="46" height="45" rx="4" fill="#DBEAFE"/>
  <rect x="260" y="145" width="46" height="45" rx="4" fill="#DBEAFE"/>
  <rect x="326" y="145" width="46" height="45" rx="4" fill="#DBEAFE"/>
  <rect x="232" y="195" width="36" height="40" rx="4" fill="#BFDBFE"/>
  <rect x="206" y="105" width="88" height="25" rx="7" fill="#2563EB"/>
  <text x="250" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="white">ATTENDLY</text>
</g>

<!-- floating books -->
<g>
  <rect x="520" y="72" width="125" height="34" rx="8" fill="#2563EB">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="535" y="108" width="125" height="34" rx="8" fill="#60A5FA">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" begin=".25s" repeatCount="indefinite"/>
  </rect>
  <rect x="550" y="144" width="125" height="34" rx="8" fill="#93C5FD">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" begin=".5s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- QR card -->
<g filter="url(#shadow)">
  <rect x="665" y="82" width="150" height="150" rx="18" fill="white"/>
  <g transform="translate(695 108)">
    <rect width="90" height="90" rx="5" fill="#111827"/>
    <rect x="8" y="8" width="24" height="24" fill="white"/>
    <rect x="14" y="14" width="12" height="12" fill="#111827"/>
    <rect x="58" y="8" width="24" height="24" fill="white"/>
    <rect x="64" y="14" width="12" height="12" fill="#111827"/>
    <rect x="8" y="58" width="24" height="24" fill="white"/>
    <rect x="14" y="64" width="12" height="12" fill="#111827"/>
    <rect x="42" y="8" width="8" height="8" fill="white"/>
    <rect x="42" y="26" width="8" height="8" fill="white"/>
    <rect x="34" y="42" width="8" height="8" fill="white"/>
    <rect x="50" y="42" width="8" height="8" fill="white"/>
    <rect x="66" y="42" width="8" height="8" fill="white"/>
    <rect x="42" y="58" width="8" height="8" fill="white"/>
    <rect x="58" y="66" width="8" height="8" fill="white"/>
    <rect x="74" y="58" width="8" height="8" fill="white"/>
  </g>
  <circle cx="735" cy="222" r="6" fill="#16A34A">
    <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="750" y="226" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#166534">LIVE SESSION</text>
</g>

<!-- little student -->
<g transform="translate(430 180)">
  <circle cx="24" cy="16" r="13" fill="#F2C7A5"/>
  <path d="M8 12C10 -2 39 -4 42 12C33 8 18 8 8 12Z" fill="#1F2937"/>
  <path d="M8 36C8 26 16 23 24 23C32 23 40 26 40 36V58H8V36Z" fill="#2563EB"/>
  <circle cx="20" cy="16" r="1.7" fill="#111827"/><circle cx="29" cy="16" r="1.7" fill="#111827"/>
  <path d="M21 21C24 23 27 23 30 21" stroke="#9A5B4A" stroke-width="2" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="translate" values="430 180;430 174;430 180" dur="3.6s" repeatCount="indefinite"/>
</g>

<text x="450" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#64748B">
  Smart attendance for modern classrooms
</text>
</svg>